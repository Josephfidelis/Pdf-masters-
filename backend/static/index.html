<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF MASTER – Convert • Edit • Manage</title>
<style>
:root{--navy:#0B2A5B;--blue:#4FA3E0;--light:#EAF4FD;--ink:#12223F}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--light);color:var(--ink)}
header{background:var(--navy);color:#fff;padding:18px 24px;display:flex;align-items:center;gap:14px}
header svg{width:40px;height:40px}header h1{margin:0;font-size:22px;letter-spacing:.5px}header small{color:#9CC9F0;display:block}
main{max-width:760px;margin:24px auto;padding:0 16px}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px #0b2a5b14;margin-bottom:16px}
select,input[type=text],button{font:inherit;padding:12px 14px;border-radius:10px;border:1px solid #c9d8ea}
select,input[type=text]{width:100%;margin-top:8px}
#drop{border:2px dashed var(--blue);border-radius:16px;padding:36px 12px;text-align:center;cursor:pointer;background:var(--light)}
#drop.over{background:#d4eafb}button.primary{background:var(--navy);color:#fff;border:0;width:100%;font-weight:600;margin-top:14px;cursor:pointer}
button:disabled{opacity:.5}progress{width:100%;height:12px;margin-top:14px}
.err{color:#b00020}.ok{color:#0a7a3b}a.dl{display:block;text-align:center;background:var(--blue);color:#fff;padding:12px;border-radius:10px;text-decoration:none;font-weight:600;margin-top:10px}
li{margin:4px 0}.meta{font-size:13px;color:#5b6b85}
</style></head><body>
<header><svg viewBox="0 0 64 64"><rect x="12" y="6" width="40" height="52" rx="6" fill="#fff"/><path d="M36 6l16 16H36z" fill="#4FA3E0"/><rect x="20" y="32" width="24" height="4" rx="2" fill="#0B2A5B"/><rect x="20" y="42" width="18" height="4" rx="2" fill="#4FA3E0"/></svg>
<div><h1>PDF MASTER</h1><small>Convert • Edit • Manage</small></div></header>
<main>
<div class="card"><label>Tool
<select id="tool">
<option value="pdf-to-docx">PDF to Word</option><option value="docx-to-pdf">Word to PDF</option>
<option value="pdf-to-xlsx">PDF to Excel</option><option value="pdf-to-images">PDF to Images</option>
<option value="images-to-pdf">Image to PDF</option><option value="merge">Merge PDF</option>
<option value="split">Split PDF</option><option value="compress">Compress PDF</option></select></label>
<input id="pages" type="text" placeholder="Pages to extract, e.g. 1-3,5" hidden>
<div id="drop" style="margin-top:14px"><b>Drag &amp; drop files here</b><div class="meta">or click to browse</div></div>
<input id="file" type="file" multiple hidden><ul id="list"></ul>
<button class="primary" id="go" disabled>Convert</button><progress id="bar" max="100" value="0" hidden></progress>
<div id="msg"></div></div>
<p class="meta" id="note"></p></main>
<script>
const $=s=>document.querySelector(s);let files=[];
const dev=localStorage.dev||(localStorage.dev=crypto.randomUUID());
const accept={'pdf-to-docx':'.pdf','pdf-to-xlsx':'.pdf','pdf-to-images':'.pdf','docx-to-pdf':'.docx','images-to-pdf':'image/*','merge':'.pdf','split':'.pdf','compress':'.pdf'};
const multi=t=>['images-to-pdf','merge'].includes(t);
function sz(b){return b>1048576?(b/1048576).toFixed(1)+' MB':Math.ceil(b/1024)+' KB'}
function render(){const t=$('#tool').value;$('#file').accept=accept[t];$('#file').multiple=multi(t);$('#pages').hidden=t!=='split';
$('#list').innerHTML=files.map(f=>`<li>${f.name.replace(/</g,'&lt;')} <span class="meta">(${sz(f.size)})</span></li>`).join('');$('#go').disabled=!files.length}
$('#tool').onchange=()=>{files=[];render()};
$('#drop').onclick=()=>$('#file').click();
$('#file').onchange=e=>{files=[...e.target.files];render()};
['dragover','dragenter'].forEach(ev=>$('#drop').addEventListener(ev,e=>{e.preventDefault();$('#drop').classList.add('over')}));
['dragleave','drop'].forEach(ev=>$('#drop').addEventListener(ev,e=>{e.preventDefault();$('#drop').classList.remove('over')}));
$('#drop').addEventListener('drop',e=>{files=[...e.dataTransfer.files];if(!multi($('#tool').value))files=files.slice(0,1);render()});
$('#go').onclick=()=>{const t=$('#tool').value,fd=new FormData();files.forEach(f=>fd.append('files',f));fd.append('pages',$('#pages').value);
const x=new XMLHttpRequest();x.open('POST','/api/tools/'+t);x.setRequestHeader('X-Device-Id',dev);
$('#go').disabled=true;$('#bar').hidden=false;$('#msg').innerHTML='Uploading…';
x.upload.onprogress=e=>{if(e.lengthComputable){$('#bar').value=e.loaded/e.total*100;if(e.loaded===e.total)$('#msg').textContent='Converting… this can take a moment'}};
x.onload=()=>{$('#bar').hidden=true;$('#go').disabled=false;let j={};try{j=JSON.parse(x.responseText)}catch{}
if(x.status===200){$('#msg').innerHTML=`<p class="ok">✔ Done – ${j.filename} (${sz(j.size)})</p>${j.meta&&j.meta.warning?`<p class="meta">${j.meta.warning}</p>`:''}<a class="dl" href="${j.download_url}" download>Download</a>`}
else $('#msg').innerHTML=`<p class="err">${(j.error&&j.error.message)||'Something went wrong. Please try again.'}</p>`;refreshNote()};
x.onerror=()=>{$('#bar').hidden=true;$('#go').disabled=false;$('#msg').innerHTML='<p class="err">Could not reach the server. Check your connection.</p>'};
x.send(fd)};
async function refreshNote(){try{const m=await (await fetch('/api/me',{headers:{'X-Device-Id':dev}})).json();
$('#note').textContent=`Free plan: ${m.remaining} of ${m.limit} conversions left today · up to ${m.max_mb} MB per file · converted files are deleted automatically after ${m.retention_minutes} minutes.`}catch{}}
render();refreshNote();
</script></body></html>
